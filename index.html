<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultorio de Urología</title>
</head>
<body>

    <!-- Buscador -->
    <form id="form-buscar-paciente">
        <input type="text" id="input-buscar-paciente" placeholder="Cédula o nombre">
        <button type="submit">Buscar</button>
    </form>

    <button type="button" data-modal-target="modal-registrar-paciente">Nuevo Paciente</button>

    <!-- Ficha del Paciente -->
    <div id="estado-vacio"><p>No hay paciente seleccionado.</p></div>
    
    <div id="ficha-paciente" hidden>
        <h2 id="ficha-paciente-nombre"></h2>
        <p><strong>Cédula:</strong> <span id="dato-cedula"></span></p>
        <p><strong>Antecedentes:</strong> <span id="dato-antecedentes"></span></p>
        <p><strong>Alergias:</strong> <span id="dato-alergias"></span></p>
        
        <button type="button" data-modal-target="modal-nueva-consulta">Nueva Consulta</button>
        <button type="button" data-modal-target="modal-nueva-cirugia">Nuevo Procedimiento</button>
    </div>

    <!-- Historial -->
    <div id="seccion-historial" hidden>
        <h3>Historial Clínico</h3>
        <ul id="timeline-lista"></ul>
    </div>

    <!-- Modal Registrar Paciente -->
    <dialog id="modal-registrar-paciente">
        <form id="form-registrar-paciente">
            <h3>Registrar Paciente</h3>
            <select id="reg-tipo-cedula"><option value="V">V</option><option value="E">E</option></select>
            <input type="text" id="reg-cedula" placeholder="Cédula" required>
            <input type="text" id="reg-nombres" placeholder="Nombres" required>
            <input type="text" id="reg-apellidos" placeholder="Apellidos" required>
            <input type="date" id="reg-fecha-nacimiento">
            <input type="text" id="reg-telefono" placeholder="Teléfono">
            <input type="email" id="reg-email" placeholder="Email">
            <textarea id="reg-antecedentes-medicos" placeholder="Antecedentes médicos"></textarea>
            <textarea id="reg-antecedentes-quirurgicos" placeholder="Antecedentes quirúrgicos"></textarea>
            <textarea id="reg-alergias" placeholder="Alergias"></textarea>
            <button type="submit">Guardar</button>
            <button type="button" data-modal-close>Cancelar</button>
        </form>
    </dialog>

    <!-- Modal Nueva Consulta -->
    <dialog id="modal-nueva-consulta">
        <form id="form-nueva-consulta">
            <h3>Nueva Consulta Urológica</h3>
            <input type="date" id="con-fecha">
            <textarea id="con-motivo" placeholder="Motivo de la consulta" required></textarea>
            <input type="number" id="con-ipss-vaciado" placeholder="IPSS Vaciado (0-5)">
            <input type="number" id="con-ipss-frecuencia" placeholder="IPSS Frecuencia (0-5)">
            <input type="text" id="con-tacto-rectal" placeholder="Examen Tacto Rectal">
            <input type="number" step="0.01" id="con-psa-total" placeholder="PSA Total">
            <input type="number" step="0.01" id="con-psa-libre" placeholder="PSA Libre">
            <textarea id="con-diagnostico" placeholder="Diagnóstico" required></textarea>
            <button type="submit">Guardar Consulta</button>
            <button type="button" data-modal-close>Cancelar</button>
        </form>
    </dialog>

    <!-- Modal Nuevo Procedimiento -->
    <dialog id="modal-nueva-cirugia">
        <form id="form-nueva-cirugia">
            <h3>Nuevo Procedimiento Quirúrgico</h3>
            <select id="cir-tipo" required>
                <option value="RTUP - Resección Transuretral de Próstata">RTUP - Resección Transuretral de Próstata</option>
                <option value="Biopsia de Próstata">Biopsia de Próstata</option>
                <option value="Cistoscopia">Cistoscopia</option>
                <option value="Litotricia">Litotricia</option>
                <option value="Circuncisión">Circuncisión</option>
                <option value="Vasectomía">Vasectomía</option>
                <option value="Otro">Otro</option>
            </select>
            <textarea id="cir-diagnostico-pre" placeholder="Diagnóstico Preoperatorio"></textarea>
            <textarea id="cir-protocolo" placeholder="Notas del cirujano"></textarea>
            <button type="submit">Guardar Procedimiento</button>
            <button type="button" data-modal-close>Cancelar</button>
        </form>
    </dialog>

    <!-- Modal Detalle -->
    <dialog id="modal-detalle-registro">
        <h3>Detalle del Registro</h3>
        <div id="modal-detalle-contenido"></div>
        <button type="button" data-modal-close>Cerrar</button>
    </dialog>

    <script type="module" src="app.js"></script>
</body>
</html>
